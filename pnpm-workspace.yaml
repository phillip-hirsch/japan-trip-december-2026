allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
    '@vitejs/plugin-react>oxc-transform-react': '*'
minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.47.2'
  - '@effect/tsgo-darwin-x64@0.47.2'
  - '@effect/tsgo-linux-arm64@0.47.2'
  - '@effect/tsgo-linux-arm@0.47.2'
  - '@effect/tsgo-linux-x64@0.47.2'
  - '@effect/tsgo-win32-arm64@0.47.2'
  - '@effect/tsgo-win32-x64@0.47.2'
  - '@effect/tsgo@0.47.2'
  - '@effect/vitest@4.0.0'
  - 'effect@4.0.0'
